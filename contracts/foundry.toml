[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
# revive charges a storage deposit per byte of deployed code, so optimise for size, not gas.
optimizer_runs = 1
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
portaldot = "https://test-evm-rpc-v3.portaldot.dev"
